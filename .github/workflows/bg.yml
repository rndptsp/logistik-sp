# Public assets that need outside downloads (no company data involved): page header photos from Wikimedia Commons
# (freely licensed only) and kecamatan borders for the district map. Runs here because those hosts rate-limit or
# block the editing environment.
#   mode=search: tools/bg_queries.json -> tools/bg_candidates.json (preview list to choose from)
#   mode=fetch:  tools/bg_photos.json  -> assets/bg/*.webp + assets/bg/bg.js (credits)
#   mode=kecamatan: geoBoundaries ADM3 -> assets/kec/<province>.js
#   mode=logos: regional emblems from Commons -> assets/logo/*.png + logo.js
name: Header photos & map data
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [search, fetch, kecamatan, logos]
        default: search
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - if: inputs.mode == 'search'
        run: python3 tools/bg_search.py tools/bg_queries.json > tools/bg_candidates.json
      - if: inputs.mode == 'fetch'
        run: python3 tools/fetch_bg.py tools/bg_photos.json
      - if: inputs.mode == 'kecamatan'
        run: python3 tools/make_kecamatan.py
      - if: inputs.mode == 'logos'
        run: python3 tools/fetch_logos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/bg_candidates.json assets
          git diff --cached --quiet && exit 0
          git commit -m "Public assets: ${{ inputs.mode }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
