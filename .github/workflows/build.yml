# Builds data/ from the master store + files uploaded on the admin page (Cloudflare R2), then pushes it.
# Raw uploads and the master store are downloaded into the runner's temp folder only: never committed, never an
# artifact, and every step's output goes to a log file that is sent to the admin page (this repo/log is public).
name: Build data from admin upload
on:
  repository_dispatch:
    types: [build-site]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Jakarta            # H-1 rule: "today" must be Indonesian today, not UTC
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
      BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
      GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}   # optional: ship-to geocoding (tools/master/geocode_gudang.py)
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Temp folders (runner context is not available in job-level env)
        run: |
          echo "MASTER_HOME=$RUNNER_TEMP/master" >> "$GITHUB_ENV"
          echo "INBOX=$RUNNER_TEMP/inbox" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r tools/requirements.txt
      - name: Report running
        run: python3 tools/ci_report.py running
      - name: Download master store + uploaded files
        run: python3 tools/ci_store.py pull "$MASTER_HOME" "$INBOX" > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E "^GAGAL" "$RUNNER_TEMP/build.log" | head -n 3; exit 1; }
      - name: Open sealed files from inbox_repo/ (encrypted to the store key; log goes to the admin page)
        run: python3 tools/repo_inbox.py open "$MASTER_HOME" "$INBOX" >> "$RUNNER_TEMP/build.log" 2>&1
      - name: Update master (log goes to the admin page)
        # on failure, print only the step outline and error kinds (no data values; the full log stays on the admin page)
        run: |
          python3 tools/master/run_web.py --inbox "$INBOX" >> "$RUNNER_TEMP/build.log" 2>&1 || {
            grep -E '^(Rencana|GAGAL|BERHENTI|REKONSILIASI|Sheet |Tidak ada|Kolom wajib|Sudah ada|Skrip ini|File tidak ada|\$ )' "$RUNNER_TEMP/build.log" | sed -E 's#/[^ ]*/##g' | cut -c1-160 | sed 's/^/::error::/'
            grep -oE '^[A-Za-z]+(Error|Exception)' "$RUNNER_TEMP/build.log" | sort -u | sed 's/^/::error::/'
            grep -E '^  File "[^"]*tools/' "$RUNNER_TEMP/build.log" | sed -E 's#.*(tools/[^"]*)", line ([0-9]+).*#::error::\1:\2#' | tail -3
            exit 1; }
      - name: Build site (log goes to the admin page)
        run: |
          MASTER_BARU="$MASTER_HOME" python3 tools/build_site_baru.py --master x >> "$RUNNER_TEMP/build.log" 2>&1 || {
            grep -oE '^[A-Za-z]+(Error|Exception)' "$RUNNER_TEMP/build.log" | sort -u | sed 's/^/::error::/'
            grep -E '^  File "[^"]*tools/' "$RUNNER_TEMP/build.log" | sed -E 's#.*(tools/[^"]*)", line ([0-9]+).*#::error::\1:\2#' | tail -3
            exit 1; }
      - name: Commit and push data
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp data/site.enc data/meta.json tools/inbox_pub.pem "$RUNNER_TEMP/out/"
          BUILD=$(python3 -c "import json;print(json.load(open('data/meta.json'))['build'])")
          ASOF=$(python3 -c "import json;print(json.load(open('data/meta.json'))['asOf'])")
          git config user.name "logistik-sp admin build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -f -B main origin/main   # -f: outputs are saved in RUNNER_TEMP; code pushed meanwhile must not block
            cp "$RUNNER_TEMP/out/site.enc" "$RUNNER_TEMP/out/meta.json" data/
            sed -E -i "s/(style\.css|app\.js|sumatra\.js)\?v=[^\"]*/\1?v=$BUILD/g" index.html
            cp "$RUNNER_TEMP/out/inbox_pub.pem" tools/
            for f in $(cat "$MASTER_HOME/_repo_inbox.txt" 2>/dev/null); do git rm -q --ignore-unmatch "$f"; done   # opened: remove the sealed copy
            git add data/site.enc data/meta.json index.html tools/inbox_pub.pem
            if git diff --cached --quiet; then echo "Data tidak berubah." >> "$RUNNER_TEMP/build.log"; exit 0; fi
            git commit -q -m "Update data dari upload admin: data s.d. $ASOF ($BUILD)"
            git push -q origin main && exit 0
            sleep 5
          done
          exit 1
      - name: Save updated master store (only after the site is published)
        run: |
          if [ -n "$(ls -A "$INBOX"/*.xlsx 2>/dev/null)" ] || [ -f "$MASTER_HOME/_push_needed" ]; then
            python3 tools/ci_store.py push "$MASTER_HOME" >> "$RUNNER_TEMP/build.log" 2>&1
            python3 tools/ci_store.py promote "$MASTER_HOME" >> "$RUNNER_TEMP/build.log" 2>&1
          else echo "Tanpa file baru: master tersimpan tidak berubah." >> "$RUNNER_TEMP/build.log"; fi
      - name: Report result
        if: always()
        run: python3 tools/ci_report.py ${{ job.status == 'success' && 'ok' || 'failed' }}
      - name: Remove master and uploads
        if: always()
        run: rm -rf "$MASTER_HOME" "$INBOX" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/out"
